    function formatMatchWithFlags(matchStr) {
      if (!matchStr.includes('-') && !matchStr.includes(' vs ')) return matchStr;
      
      let separator = matchStr.includes(' - ') ? ' - ' : (matchStr.includes(' vs ') ? ' vs ' : '-');
      const parts = matchStr.split(separator);
      if (parts.length === 2) {
        const home = parts[0].trim();
        const away = parts[1].trim();
        const homeCode = teamCodes ? teamCodes[home] : (typeof TEAM_CODES !== 'undefined' ? TEAM_CODES[home] : null);
        const awayCode = teamCodes ? teamCodes[away] : (typeof TEAM_CODES !== 'undefined' ? TEAM_CODES[away] : null);
        
        const homeTranslated = window.i18n ? window.i18n.t(`teams.${home}`) : home;
        const awayTranslated = window.i18n ? window.i18n.t(`teams.${away}`) : away;
        
        const homeImg = homeCode ? `<img src="https://flagcdn.com/w40/${homeCode}.png" class="flag-img" style="margin-right:6px">` : '';
        const awayImg = awayCode ? `<img src="https://flagcdn.com/w40/${awayCode}.png" class="flag-img" style="margin-right:6px">` : '';
        
        return `<div style="display:flex; align-items:center;">
                  <div style="flex:1; text-align:right;">${homeTranslated} ${homeImg}</div>
                  <div style="margin:0 8px; color:var(--text-muted); font-size:0.7rem;">${separator.trim()}</div>
                  <div style="flex:1; text-align:left;">${awayImg} ${awayTranslated}</div>
                </div>`;
      }
      return matchStr;
    }

    let tournamentState = null;

    async function fetchCloudData() {
      if (!RENDER_URL) return;

        const select = document.getElementById('playerSelect');

        });

            opt.value = playerName;
            opt.textContent = '☁️ ' + playerName;
            select.appendChild(opt);
          });
        }

      } catch (error) {
        console.error('Error fetching data:', error);
        document.getElementById('playerSelect').options[0].text = 'Error cargando nube. Mostrando local.';
      }
    }

    function renderPool() {
      const headerRow = document.getElementById('poolHeaderRow');
      const tbody = document.getElementById('poolBody');
      
      const players = Object.keys(cloudData).sort();
      
      // Incluir siempre los datos locales si el usuario actual no está ya en la lista de la nube
      const localRaw = localStorage.getItem(`worldcup2026_predictions_${currentUser.groupName}`);
      if (localRaw) {
        try {
          const data = JSON.parse(localRaw);
          if (data._playerName && !players.includes(data._playerName)) {
            // Añadir temporalmente para visualización
            cloudData[data._playerName] = { predictions: data };
            players.push(data._playerName);
            players.sort();
          }
        } catch (e) { }
      }

      // Update Header: ID, Match, and then each Player
      let headerHtml = `<th style="width:70px">ID</th><th style="width:240px; text-align:left;">Partido</th>`;
      players.forEach(p => {
        headerHtml += `<th class="participant-header">${p}</th>`;
      });
      headerRow.innerHTML = headerHtml;

      const groupMatchKeys = buildGroupMatchKeys();
      const koKeys = buildKoMatchKeys();
      let poolRowIndex = 0;

      if (window.i18n) window.i18n.updateDOM();
      tbody.innerHTML = poolMatches.map(item => {
        if (item.section) {
          return `<tr class="pool-section-header"><td colspan="${2 + players.length}">${item.section}</td></tr>`;
        }

        poolRowIndex++;

        let playerCells = '';
        players.forEach(p => {
          const playerPredictions = cloudData[p].predictions;
          const key = findPredictionKey(item, poolRowIndex, groupMatchKeys, koKeys);
          let score = '–';
          
          const isMe = p === currentUser.name;
          const canSeeOthers = tournamentState?.hasStarted;

          if (key) {
            if (!isMe && !canSeeOthers) {
              score = '🔒';
            } else {
              if (key.single) {
                score = playerPredictions[key.single] || '–';
              } else {
                const h = playerPredictions[key.home];
                const a = playerPredictions[key.away];
                if (h !== undefined && h !== "" && a !== undefined && a !== "") {
                  score = `${h} - ${a}`;
                }
              }
            }
          }
          playerCells += `<td class="pool-score">${score}</td>`;
        });

        return `
          <tr>
            <td><span class="pool-match-id">${item.id}</span></td>
            <td class="pool-match-name">${formatMatchWithFlags(item.match)}</td>
            ${playerCells}
          </tr>
        `;
      }).join('');
      if (window.i18n) window.i18n.updateDOM();
    }

    function buildGroupMatchKeys() {
      // Maps pool match index to worldcup input IDs
      const groups = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'];
      const map = {};
      let idx = 0;
      // J1: 24 matches (2 per group)
      for (let g = 0; g < 12; g++) {
        map[idx++] = { home: `g${groups[g]}_m0_h`, away: `g${groups[g]}_m0_a` };
        map[idx++] = { home: `g${groups[g]}_m1_h`, away: `g${groups[g]}_m1_a` };
      }
      // J2: 24 matches
      for (let g = 0; g < 12; g++) {
        map[idx++] = { home: `g${groups[g]}_m2_h`, away: `g${groups[g]}_m2_a` };
        map[idx++] = { home: `g${groups[g]}_m3_h`, away: `g${groups[g]}_m3_a` };
      }
      // J3: 24 matches
      for (let g = 0; g < 12; g++) {
        map[idx++] = { home: `g${groups[g]}_m4_h`, away: `g${groups[g]}_m4_a` };
        map[idx++] = { home: `g${groups[g]}_m5_h`, away: `g${groups[g]}_m5_a` };
      }
      return map;
    }

    function buildKoMatchKeys() {
      const koNums = [73, 76, 74, 75, 78, 77, 79, 80, 82, 81, 84, 83, 85, 88, 86, 87,
        90, 89, 91, 92, 93, 94, 95, 96,
        97, 98, 99, 100,
        101, 102,
        103, 104];
      const map = {};
      koNums.forEach(n => {
        map[String(n)] = { home: `ko_${n}_h`, away: `ko_${n}_a` };
      });
      return map;
    }

    function findPredictionKey(item, poolIdx, groupKeys, koKeys) {
      // Group phase matches (first 72 pool items that aren't sections)
      if (item.id && item.id.match(/^[A-L]\d$/)) {
        // Group match
        const adjustedIdx = poolIdx - 1;
        return groupKeys[adjustedIdx] || null;
      }
      // Knockout
      if (item.id && item.id.match(/^\d+$/)) {
        return koKeys[item.id] || null;
      }
      // Awards (Individual Prizes)
      if (item.single) {
        return { single: item.single };
      }
      return null;
    }
