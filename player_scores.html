<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Clasificación y Puntuaciones de la Porra - Mundial 2026">
  <title>Clasificación - Porra Mundial 2026</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .leaderboard-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      margin-bottom: 2rem;
    }

    .lb-row {
      display: grid;
      grid-template-columns: 50px 1fr 80px 75px 75px 75px 100px 50px;
      padding: 1rem 1.5rem;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: background 0.2s ease;
      position: relative;
    }

    .lb-row:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .lb-header-row {
      background: rgba(0, 0, 0, 0.2);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 700;
      cursor: default;
    }

    .lb-rank {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-muted);
      text-align: center;
    }

    .lb-top1 .lb-rank { color: var(--accent-gold); }
    .lb-top2 .lb-rank { color: #d1d5db; }
    .lb-top3 .lb-rank { color: #b45309; }

    .lb-name {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lb-points {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-primary);
      text-align: right;
    }

    .lb-pts-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-left: 4px;
    }

    .lb-trend { text-align: center; font-size: 1.1rem; }
    .trend-up { color: var(--accent-green); }
    .trend-dn { color: var(--accent-red); }
    .trend-eq { color: var(--text-muted); }

    .lb-breakdown {
      grid-column: 1 / -1;
      background: rgba(0, 0, 0, 0.15);
      border-top: 1px dashed var(--border-color);
      padding: 1.5rem;
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .lb-b-item { display: flex; flex-direction: column; gap: 4px; }
    .lb-b-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .lb-b-value { font-size: 1.1rem; font-weight: 700; color: var(--text-secondary); }
    .lb-b-value span { color: var(--text-primary); }

    .lb-history-container {
      grid-column: 1 / -1;
      margin-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1rem;
    }

    .lb-history-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--accent-cyan);
      font-weight: 700;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lb-history-scroll {
      max-height: 250px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.2);
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .lb-history-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .lb-history-table th {
      text-align: left; padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-secondary);
      font-size: 0.65rem; text-transform: uppercase;
      position: sticky; top: 0;
    }
    .lb-history-table td { padding: 8px 12px; border-top: 1px solid rgba(255, 255, 255, 0.03); }

    .hist-match { font-weight: 600; color: var(--text-primary); }
    .hist-pts { font-weight: 800; color: var(--accent-gold); text-align: right; }
    .hist-reason { color: var(--text-muted); font-size: 0.75rem; }

    .ai-summary-box {
      margin-top: 1rem; padding: 1rem;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: var(--radius-md);
      font-size: 0.9rem; line-height: 1.5; color: var(--text-primary);
      display: none; animation: fadeIn 0.3s ease;
      grid-column: 1 / -1;
    }

    .ai-btn {
      position: absolute; right: 10px; top: 10px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white; border: none; padding: 4px 8px; border-radius: 4px;
      font-size: 0.7rem; cursor: pointer; font-weight: 700; transition: transform 0.2s;
    }

    .ai-btn:hover { transform: scale(1.05); filter: brightness(1.1); }

    @media (max-width: 768px) {
      .lb-row { grid-template-columns: 40px 1fr 80px 40px; padding: 0.6rem 0.8rem; font-size: 0.85rem; }
      .lb-rank { font-size: 1.2rem; }
      .lb-name { font-size: 0.95rem; }
      .lb-points { font-size: 1.1rem; }
      .ai-btn { position: relative; right: 0; top: 0; grid-column: span 4; margin-top: 8px; }
    }
  </style>
</head>

<body>
  <nav class="main-nav">
    <div class="nav-inner">
      <a href="player_scores.html" class="nav-logo">
        <span class="nav-logo-icon">⚽</span>
        <span class="nav-logo-text" data-i18n="common.app_title">Mundial 2026</span>
      </a>
      <div class="nav-links" id="navLinks">
        <!-- Generado dinámicamente -->
      </div>
      <div id="navUserInfo" class="nav-user" style="display:none;">
        <span class="nav-user-name" id="displayUserName"></span>
        <a href="#" onclick="handleLogout()" class="nav-logout" data-i18n="common.logout">Cerrar Sesión</a>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <h1><span class="header-icon">📈</span> <span class="header-text-gradient" data-i18n="dashboard.leaderboard_title">Clasificación General</span></h1>
    <p class="subtitle" data-i18n="login.subtitle">Descubre cómo van tus predicciones comparado con la realidad</p>
  </header>

  <main class="main-content">
    <!-- Countdown / Phase Info -->
    <div id="tournamentBanner" class="group-card" style="margin-bottom:2rem; display:none; overflow: hidden; position: relative; border-left: 5px solid var(--accent-blue);">
      <div style="padding: 1.25rem 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div id="phaseIcon" style="font-size: 2rem;">🗓️</div>
          <div>
            <div id="phaseName" style="font-weight: 700; font-size: 1.1rem; color: var(--text-primary);">Cargando fase...</div>
            <div id="phaseStatus" style="font-size: 0.85rem; color: var(--text-muted);">Estado del torneo</div>
          </div>
        </div>
        <div id="countdownContainer" style="text-align: right; min-width: 150px;">
          <div style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 2px;" data-i18n="dashboard.closing_in">Cierre en:</div>
          <div id="countdownTimer" style="font-family: 'Inter', monospace; font-weight: 800; font-size: 1.5rem; color: var(--accent-blue);">00:00:00</div>
        </div>
      </div>
    </div>

    <div class="leaderboard-card" id="leaderboardContainer">
      <div class="lb-row lb-header-row">
        <div style="text-align:center;" data-i18n="dashboard.pos">Pos</div>
        <div data-i18n="dashboard.player">Jugador</div>
        <div class="hide-mobile" style="text-align:center;" data-i18n="dashboard.exact">Plenos 🎯</div>
        <div class="hide-mobile" style="text-align:center;" data-i18n="results.groups_tab">Grupos</div>
        <div class="hide-mobile" style="text-align:center;" data-i18n="results.knockout_tab">Elim.</div>
        <div class="hide-mobile" style="text-align:center;" data-i18n="results.honor_title">Honor</div>
        <div style="text-align:right;" data-i18n="dashboard.points_col">Puntos Totales</div>
        <div style="text-align:center;">Trend</div>
      </div>
      <div id="lbBody">
        <!-- Rendered by JS -->
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="i18n.js"></script>
  <script src="web_config.js"></script>
  <script type="module">
    import { checkAuth, handleLogout, showToast, renderNavigation, initOnboarding } from './shared_ui.js';
    import { calculateScore, calculateLeaderboard } from './agente_mundial/scoringEngine.js';
    import { apiCall } from './agente_mundial/dataFetcher.js';

    window.handleLogout = handleLogout;
    renderNavigation('player_scores.html');
    initOnboarding('player_scores.html');
    window.toggleBreakdown = (idx) => {
      const el = document.getElementById(`breakdown_${idx}`);
      const isVisible = el.style.display === 'grid';
      document.querySelectorAll('.lb-breakdown').forEach(d => d.style.display = 'none');
      el.style.display = isVisible ? 'none' : 'grid';
    };

    let currentUser = checkAuth();
    let reality = JSON.parse(localStorage.getItem(`worldcup2026_testing_reality_${currentUser?.groupName}`)) || null;
    let savedSummaries = {};

    function updateTournamentUI(tournamentState) {
      const banner = document.getElementById('tournamentBanner');
      const phaseName = document.getElementById('phaseName');
      const phaseStatus = document.getElementById('phaseStatus');
      
      banner.style.display = 'block';
      const mode = tournamentState.predictionMode || 'A';
      phaseName.innerHTML = `${window.i18n ? window.i18n.t('predictions.round_' + tournamentState.id) : tournamentState.name} <span style="font-size: 0.6rem; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; margin-left: 8px;">MODO ${mode}</span>`;
      
      if (tournamentState.isPredictionWindow) {
        // Validación de cumplimiento (usando los datos cargados en init)
        const isComplete = checkCompliance(tournamentState);
        if (isComplete) {
          phaseStatus.innerHTML = `✅ <a href="worldcup.html" style="color:inherit; text-decoration:underline; font-weight:700;">¡Todo listo!</a> Tus predicciones están registradas.`;
          banner.style.borderColor = "var(--accent-green)";
          banner.style.background = "rgba(16, 185, 129, 0.05)";
        } else {
          phaseStatus.innerHTML = `🚨 <a href="worldcup.html" style="color:inherit; text-decoration:underline; font-weight:700;">¡Pendiente!</a> Tienes partidos sin pronosticar.`;
          banner.style.borderColor = "var(--accent-red)";
          banner.style.background = "rgba(239, 68, 68, 0.05)";
        }
        startCountdown(tournamentState.nextDeadline);
      } else {
        phaseStatus.textContent = "🔒 Fase bloqueada (Partidos en curso)";
        banner.style.borderColor = "var(--border-color)";
        banner.style.background = "var(--bg-card)";
        document.getElementById('countdownContainer').innerHTML = `<div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">PRÓXIMA FASE: <br> ${tournamentState.nextDeadline ? new Date(tournamentState.nextDeadline).toLocaleDateString() : 'Pendiente'}</div>`;
      }
    }

    function checkCompliance(state) {
      if (!currentUser || !window.lastLoadedPredictions) return false;
      
      const data = window.lastLoadedPredictions;
      const mode = state.predictionMode || 'A';
      const phaseId = state.id;
      const unlocks = state.unlocks || [];
      let missing = false;

      // 1. Validar Partidos
      if (phaseId === 'PRE_TOURNAMENT') {
          const groupMatchKeys = Object.keys(data).filter(k => k.startsWith('g'));
          // En 2026 hay 72 partidos de grupo, cada uno con local y visitante = 144 campos
          if (groupMatchKeys.length < 144) missing = true;
          if (groupMatchKeys.some(k => !data[k] || data[k].toString().trim() === '')) missing = true;
          
          if (mode === 'A') {
              const koKeys = Object.keys(data).filter(k => k.startsWith('ko_'));
              // Hay 32 partidos de eliminatoria (16avos a Final) * 2 = 64 campos
              if (koKeys.length < 64 || koKeys.some(k => !data[k] || data[k].toString().trim() === '')) missing = true;
          }
      } else {
          // Durante el torneo, miramos los unlocks
          unlocks.forEach(u => {
              if (u === 'groups') {
                  if (Object.keys(data).filter(k => k.startsWith('g')).some(k => !data[k] || data[k].toString().trim() === '')) missing = true;
              } else if (u.startsWith('r') || u === 'qf' || u === 'sf' || u === 'final' || u === '3rd') {
                  const koKeys = Object.keys(data).filter(k => k.startsWith('ko_'));
                  if (koKeys.some(k => !data[k] || data[k].toString().trim() === '')) missing = true;
              }
          });
      }

      // 2. Validar Premios
      if (phaseId === 'PRE_TOURNAMENT' || unlocks.includes('honor')) {
        const awardIds = ['boot_gold', 'boot_silver', 'boot_bronze', 'ball_gold', 'ball_silver', 'ball_bronze'];
        if (awardIds.some(id => !data[id] || data[id].toString().trim() === '')) missing = true;
      }

      return !missing;
    }

    function startCountdown(deadlineStr) {
      const deadline = new Date(deadlineStr).getTime();
      const timer = setInterval(() => {
        const now = Date.now();
        const diff = deadline - now;
        if (diff <= 0) {
          clearInterval(timer);
          document.getElementById('countdownTimer').textContent = "CERRADO";
          return;
        }
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        const daysPart = d > 0 ? `${d}d ` : '';
        document.getElementById('countdownTimer').textContent = 
          `${daysPart}${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
      }, 1000);
    }

    async function init() {
      if (!currentUser) return;
      const lbBody = document.getElementById('lbBody');
      lbBody.innerHTML = '<div style="padding: 2rem; text-align: center; color: var(--text-muted);">⏳ Cargando datos...</div>';

      try {
        // 1. Obtener reglas, predicciones, resúmenes y REALIDAD en paralelo
        const [rulesRes, predsRes, summariesRes, realityRes, stateRes] = await Promise.all([
          apiCall({ action: 'getRules', groupName: currentUser.groupName }),
          apiCall({ action: 'getPredictions', groupName: currentUser.groupName }),
          apiCall({ action: 'getAllSummaries', groupName: currentUser.groupName }),
          apiCall({ action: 'getReality' }),
          apiCall({ action: 'tournament-state' })
        ]);

        const rules = rulesRes?.status === 'success' ? rulesRes.data : {};
        const playersData = predsRes?.status === 'success' ? predsRes.data : {};
        savedSummaries = summariesRes?.status === 'success' ? summariesRes.data : {};
        const cloudReality = realityRes?.status === 'success' ? realityRes.data : {};
        const tournamentState = stateRes?.data || null;

        // Guardar para validación de cumplimiento
        window.lastLoadedPredictions = playersData[currentUser.name]?.predictions || {};

        if (tournamentState) {
          updateTournamentUI(tournamentState);
        }

        // 2. Calcular clasificación (Priorizando la realidad de la nube)
        const finalReality = (cloudReality && Object.keys(cloudReality).length > 0) ? cloudReality : reality;

        if (!finalReality || Object.keys(finalReality).length === 0) {
          lbBody.innerHTML = `<div style="padding: 2rem; text-align: center; color: var(--text-muted);"> ${window.i18n ? window.i18n.t('dashboard.no_results_cloud') : '⚠️ No hay resultados oficiales en la nube.'}</div>`;
          return;
        }

        const scoreResults = calculateLeaderboard(playersData, finalReality, rules);
        renderLeaderboard(scoreResults);

      } catch (e) {
        console.error(e);
        lbBody.innerHTML = `<div style="padding: 2rem; text-align: center; color: var(--accent-red);">${window.i18n ? window.i18n.t('dashboard.error_loading_leaderboard') : '❌ Error al cargar la clasificación.'}</div>`;
      }
    }

    function renderLeaderboard(results) {
      const container = document.getElementById('lbBody');
      if (window.i18n) window.i18n.updateDOM();
      container.innerHTML = results.map((r, idx) => {
        const topClass = idx === 0 ? 'lb-top1' : idx === 1 ? 'lb-top2' : idx === 2 ? 'lb-top3' : '';
        const trend = Math.random() > 0.5 ? 'up' : 'eq'; // Placeholder trend
        const trendIcon = trend === 'up' ? '▲' : '–';

        return `
          <div class="lb-row ${topClass}" onclick="toggleBreakdown(${idx})">
            <div class="lb-rank">${idx + 1}</div>
            <div class="lb-name">${r.name}</div>
            <div class="lb-plenos hide-mobile" style="justify-content: center;"><span>${r.exactHits}</span></div>
            <div class="hide-mobile" style="text-align:center; color: var(--text-secondary);">${r.groupPts}</div>
            <div class="hide-mobile" style="text-align:center; color: var(--text-secondary);">${r.koPts}</div>
            <div class="hide-mobile" style="text-align:center; color: var(--text-secondary);">${r.honorPts}</div>
            <div class="lb-points">${r.totalPts}<span class="lb-pts-label" data-i18n="dashboard.points">pts</span></div>
            <div class="lb-trend trend-${trend}">${trendIcon}</div>
            
            <button class="ai-btn" onclick="event.stopPropagation(); window.fetchAISummary('${r.name}', ${idx})">✨ <span data-i18n="dashboard.ai_summary_btn">Resumen IA</span></button>
            
            <div class="ai-summary-box" id="ai_summary_${idx}" style="${savedSummaries[r.name] ? 'display:block' : ''}">
              ${savedSummaries[r.name] ? `<strong>IA:</strong> ${savedSummaries[r.name]}` : ''}
            </div>

            <div class="lb-breakdown" id="breakdown_${idx}">
              <div class="lb-b-item"><span class="lb-b-label" data-i18n="dashboard.groups_label">Grupos</span><span class="lb-b-value"><span>${r.groupPts}</span> pts</span></div>
              <div class="lb-b-item"><span class="lb-b-label" data-i18n="dashboard.knockout_label">Eliminatorias</span><span class="lb-b-value"><span>${r.koPts}</span> pts</span></div>
              <div class="lb-b-item"><span class="lb-b-label" data-i18n="dashboard.honor_label">Honor</span><span class="lb-b-value"><span>${r.honorPts}</span> pts</span></div>
              <div class="lb-b-item"><span class="lb-b-label" data-i18n="dashboard.exact">Exactos</span><span class="lb-b-value"><span>${r.exactHits}</span></span></div>
              
              <div class="lb-history-container">
                <div class="lb-history-title">📝 <span data-i18n="dashboard.breakdown_title">Desglose de puntos</span></div>
                <div class="lb-history-scroll">
                  <table class="lb-history-table">
                    <thead><tr><th data-i18n="dashboard.history_match">Partido</th><th style="text-align:right" data-i18n="dashboard.history_pts">Pts</th><th data-i18n="dashboard.history_reason">Motivo</th></tr></thead>
                    <tbody>
                      ${r.history.map(h => {
                        let match = h.match;
                        let reason = h.reason;
                        if (window.i18n) {
                          // Translate team names in match name
                          Object.keys(translations['es'].teams).forEach(team => {
                            match = match.replace(new RegExp(team, 'g'), window.i18n.t(`teams.${team}`));
                          });
                          // Translate common reasons
                          if (window.i18n.locale === 'en') {
                            reason = reason.replace(/Signo/g, 'Sign')
                                           .replace(/Exacto/g, 'Exact')
                                           .replace(/Diferencia/g, 'Difference')
                                           .replace(/Acierto/g, 'Hit')
                                           .replace(/Posición/g, 'Position')
                                           .replace(/Grupo/g, 'Group')
                                           .replace(/Clasificado/g, 'Qualified')
                                           .replace(/Campeón/g, 'Champion')
                                           .replace(/Subcampeón/g, 'Runner-up')
                                           .replace(/3er Puesto/g, '3rd Place')
                                           .replace(/Bota/g, 'Boot')
                                           .replace(/Balón/g, 'Ball');
                          }
                        }
                        return `<tr><td class="hist-match">${match}</td><td class="hist-pts">+${h.pts}</td><td class="hist-reason">${reason}</td></tr>`;
                      }).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
      if (window.i18n) window.i18n.updateDOM();
    }

    window.fetchAISummary = async (playerName, idx) => {
      const box = document.getElementById(`ai_summary_${idx}`);
      box.style.display = 'block';
      box.innerHTML = `<i>✨ ${window.i18n ? window.i18n.t('dashboard.generating') : 'Generando resumen...'}</i>`;
      try {
        const res = await apiCall({ action: 'getSummary', playerName, groupName: currentUser.groupName });
        if (res.status === 'success') {
          box.innerHTML = `<strong>IA:</strong> ${res.data}`;
        } else {
          box.innerHTML = `⚠️ ${res.message || 'Error'}`;
        }
      } catch (e) {
        box.innerHTML = '⚠️ ' + (window.i18n ? window.i18n.t('common.error') : 'Error');
      }
    };

    init();
  </script>
</body>
</html>
