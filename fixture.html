<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fixture del Mundial 2026 - Cuadro de grupos, clasificaciones y eliminatorias">
  <title>Results - Porra Mundial 2026</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .fixture-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 900px) {
      .fixture-pair { grid-template-columns: 1fr; }
    }
    .fixture-group-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: all 0.3s ease;
      animation: fadeInUp 0.5s ease forwards;
    }
    .fixture-group-card:hover {
      border-color: rgba(59, 130, 246, 0.3);
      box-shadow: var(--shadow-card), var(--shadow-glow);
    }
    .fixture-matches {
      padding: 0.5rem 0.75rem;
    }
    .fixture-match {
      display: grid;
      grid-template-columns: 32px 1fr 44px 20px 44px 1fr;
      align-items: center;
      padding: 0.45rem 0.5rem;
      gap: 4px;
      font-size: 0.78rem;
    }
    .fixture-match + .fixture-match {
      border-top: 1px solid rgba(42, 51, 80, 0.3);
    }
    .fixture-match .fm-num {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .fixture-match .fm-home {
      text-align: right;
      font-weight: 600;
    }
    .fixture-match .fm-away {
      text-align: left;
      font-weight: 600;
    }
    .fixture-match .fm-score {
      text-align: center;
      font-weight: 800;
      color: var(--accent-gold);
      font-size: 0.85rem;
    }
    .fixture-match .fm-vs {
      text-align: center;
      font-size: 0.6rem;
      color: var(--text-muted);
      font-weight: 700;
    }
    .fixture-match .fm-pos {
      font-size: 0.65rem;
      color: var(--accent-cyan);
      font-weight: 600;
    }
    
    /* Knockout bracket cards */
    .ko-bracket-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .ko-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.25s ease;
    }
    .ko-card:hover {
      border-color: rgba(59, 130, 246, 0.3);
      transform: translateY(-1px);
    }
    .ko-card .ko-num {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 600;
      min-width: 24px;
    }
    .ko-card .ko-teams {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ko-card .ko-team {
      font-size: 0.8rem;
      font-weight: 600;
      flex: 1;
    }
    .ko-card .ko-team-home { text-align: right; }
    .ko-card .ko-team-away { text-align: left; }
    .ko-card .ko-score {
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--accent-gold);
      min-width: 50px;
      text-align: center;
    }
    
    /* Point tracker table */
    .points-section {
      margin-top: 3rem;
    }
    .points-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.8rem;
    }
    .points-table thead th {
      background: rgba(59, 130, 246, 0.08);
      padding: 0.55rem 0.6rem;
      text-align: center;
      font-weight: 700;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
    }
    .points-table thead th:first-child {
      text-align: left;
    }
    .points-table tbody td {
      padding: 0.45rem 0.6rem;
      text-align: center;
      border-bottom: 1px solid rgba(42, 51, 80, 0.3);
    }
    .points-table tbody td:first-child {
      text-align: left;
      font-weight: 600;
    }
    .points-table tbody tr:hover {
      background: rgba(59, 130, 246, 0.05);
    }
  </style>

function renderFixtureGroups() {
  const container = document.getElementById('fixtureGroups');
  
  // Render groups in pairs (2 per row)
  let html = '';
  for (let i = 0; i < fixtureGroups.length; i += 2) {
    html += '<div class="fixture-pair" style="margin-bottom:1.5rem;">';
    for (let j = i; j < Math.min(i + 2, fixtureGroups.length); j++) {
      const g = fixtureGroups[j];
      html += `
        <div class="fixture-group-card" style="animation-delay:${j * 0.05}s">
          <div class="group-header">
            <div class="group-letter">${g.letter}</div>
            <div>
              <div class="group-name">Grupo ${g.letter}</div>
              <div class="group-teams-summary">${g.teams.map(t => t.abbr).join(' · ')}</div>
            </div>
          </div>
          <div class="fixture-matches">
            ${g.matches.map(m => `
              <div class="fixture-match">
                <span class="fm-num">#${m.num}</span>
                <span class="fm-home">${m.home}</span>
                <span class="fm-score">–</span>
                <span class="fm-vs">vs</span>
                <span class="fm-score">–</span>
                <span class="fm-away">${m.away}</span>
              </div>
            `).join('')}
          </div>
          <!-- Standings -->
          <div class="group-standings-container">
            <div class="standings-title">Clasificación</div>
            <table class="standings-table">
              <thead>
                <tr>
                  <th style="width:25px">#</th>
                  <th style="text-align:left">Sel</th>
                  <th>Pts</th>
                  <th>DG</th>
                  <th>GF-GC</th>
                </tr>
              </thead>
              <tbody>
                ${g.standings.map((team, idx) => `
                  <tr>
                    <td class="pos-cell">${idx + 1}</td>
                    <td class="team-cell">${team}</td>
                    <td class="pts-cell">0</td>
                    <td>0</td>
                    <td style="color:var(--text-muted)">0-0</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }
    html += '</div>';
  }
  container.innerHTML = html;
}

function renderKnockoutBracket() {
  const container = document.getElementById('fixtureBracket');
  
  container.innerHTML = knockoutBracket.map(round => `
    <div class="knockout-section">
      <div class="knockout-title">
        <span class="knockout-badge ${round.badge}">${round.name === 'FINAL' ? '🏆' : ''}</span>
        ${round.name}
      </div>
      <div class="ko-bracket-grid">
        ${round.matches.map(m => `
          <div class="ko-card">
            <span class="ko-num">#${m.num}</span>
            <div class="ko-teams">
              <span class="ko-team ko-team-home">${m.home}</span>
              <span class="ko-score">– : –</span>
              <span class="ko-team ko-team-away">${m.away}</span>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

                </tr>
              `).join('')}
            </tbody>

        </div>

  `;
