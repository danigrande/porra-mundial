<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados - Porra Mundial 2026</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-controls {
      background: var(--bg-card);
      padding: 1rem;
      border-radius: var(--radius-lg);
      margin-bottom: 2rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      position: sticky;
      top: 1rem;
      z-index: 1000;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--accent-gold);
    }
    .btn-random {
      background: linear-gradient(135deg, #8b5cf6, #d946ef);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-md);
      font-weight: 700;
      cursor: pointer;
    }
    .match-edit {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .match-edit:last-child { border-bottom: none; }
    .score-input {
      width: 45px !important;
      text-align: center;
      padding: 4px !important;
      background: rgba(0,0,0,0.3) !important;
    }
  </style>
</head>
<body>
  <nav class="main-nav">
    <div class="nav-inner">
      <a href="worldcup.html" class="nav-logo">
        <span class="nav-logo-icon">⚽</span>
        <span class="nav-logo-text">Mundial 2026</span>
      </a>
      <div class="nav-links" id="navLinks">
        <!-- Generado dinámicamente -->
      </div>
      <div id="navUserInfo" class="nav-user" style="display:none;">
        <span class="nav-user-name" id="displayUserName"></span>
        <a href="#" onclick="handleLogout()" class="nav-logout">Cerrar Sesión</a>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <h1><span class="header-icon">⚙️</span> <span class="header-text-gradient">Resultados – Control Oficial</span></h1>
    <p class="subtitle">Control total del torneo. Lo que pongas aquí afecta a todos los rankings.</p>
  </header>

  <main class="main-content">
    <div class="admin-controls">
      <button class="btn-save" id="btnSave" onclick="saveReality()">💾 Guardar en Nube</button>
      <button class="btn-random" onclick="fillAll()">🎲 Rellenar Todo (Simulación API)</button>
      <button class="btn-reset" onclick="resetAll()">🗑️ Borrar Todo</button>
    </div>

    <div id="fixtureGroups" class="groups-grid"></div>
    <div id="fixtureBracket" class="knockout-container"></div>
    <div id="awardsContainer"></div>
  </main>

  <script src="web_config.js"></script>
  <script type="module">
    import { checkAuth, handleLogout, showToast, renderNavigation } from './shared_ui.js';
    import { TEAM_CODES, FIXTURE_GROUPS, KNOCKOUT_BRACKET, BRACKET_MATCHES } from './agente_mundial/shared_data.js';
    import { getStandings, fullResolve } from './agente_mundial/scoringEngine.js';
    import { apiCall } from './agente_mundial/dataFetcher.js';

    window.handleLogout = handleLogout;
    renderNavigation('fixture_testing.html');
    let currentUser = checkAuth();
    let reality = {};

    function getTeamHtml(name) {
      const code = TEAM_CODES[name];
      return code ? `<img src="https://flagcdn.com/w40/${code}.png" class="flag-img"> ${name}` : name;
    }

    window.fillAll = async () => {
      if(!confirm('Esto simulará resultados, goles y tarjetas para TODO el torneo. ¿Continuar?')) return;
      const res = await apiCall({ action: 'simulateAll' });
      if (res.status === 'success') {
        reality = res.data.results;
        render(reality);
        showToast('✅ Todo el torneo simulado y guardado');
      }
    };

    window.resetAll = async () => {
      if(confirm('¿Seguro que quieres borrar todos los resultados y eventos (goles/tarjetas) de la nube?')) {
        const btn = document.getElementById('btnSave');
        btn.disabled = true;
        // Enviamos objeto de eventos vacío para forzar el borrado en el backend
        // Y resultados vacíos
        const res = await apiCall({ action: 'saveReality', results: { events: {} } }, { method: 'POST' });
        btn.disabled = false;
        
        if (res.status === 'success') {
          reality = { events: {} };
          // Forzamos que los inputs se vacíen visualmente
          document.querySelectorAll('.score-input').forEach(input => input.value = '');
          render(reality);
          showToast('🗑️ Todo borrado (resultados y eventos)');
        }
      }
    };

    window.simulateMatch = async (matchId, homeTeam, awayTeam) => {
      // Capturamos el estado actual del UI por si hay cambios manuales sin guardar
      const currentUI = collectData();
      
      const res = await apiCall({ action: 'simulateMatch', matchId, homeTeam, awayTeam });
      if (res.status === 'success') {
        // La DB ya tiene el nuevo partido simulado. 
        // Actualizamos nuestro objeto local 'reality' con la respuesta completa
        reality = res.data.results;
        render(reality);
        showToast('✅ Partido simulado individualmente');
      }
    };

    window.saveReality = async () => {
      const results = collectData();
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.textContent = '⏳ Guardando...';

      const res = await apiCall({ action: 'saveReality', results }, { method: 'POST' });
      btn.disabled = false;
      btn.textContent = '💾 Guardar en Nube';

      if (res.status === 'success') {
        localStorage.setItem(`worldcup2026_testing_reality_${currentUser.groupName}`, JSON.stringify(results));
        showToast('✅ Resultados oficiales actualizados');
      }
    };

    function collectData() {
      const data = { events: reality.events || {} };
      document.querySelectorAll('.score-input').forEach(input => {
        if (input.value !== '') data[input.id] = input.value;
      });
      return data;
    }

    async function init() {
      const res = await apiCall({ action: 'getReality' });
      if (res.status === 'success') reality = res.data;
      render(reality);
    }

    function render(overrideData = null) {
      const currentData = overrideData || collectData();
      reality = currentData;
      
      // 1. Grupos con edición
      const groupsContainer = document.getElementById('fixtureGroups');
      groupsContainer.innerHTML = FIXTURE_GROUPS.map(g => {
        const standings = getStandings(g.letter, currentData);
        return `
          <div class="group-card">
            <div class="group-header">
              <div class="group-letter">${g.letter}</div>
              <div class="group-name">Grupo ${g.letter}</div>
            </div>
            <div style="padding:1rem;">
              <!-- Edición de Partidos -->
              <div class="match-list" style="margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
                ${[0,1,2,3,4,5].map(mIdx => {
                  const matchId = `g${g.letter}_m${mIdx}`;
                  const hId = `${matchId}_h`;
                  const aId = `${matchId}_a`;
                  const hName = g.teams[mIdx % 4];
                  const aName = g.teams[(mIdx+1) % 4];
                  const matchEvents = (currentData.events && currentData.events[matchId]) || [];
                  
                  return `
                    <div class="match-edit" style="display:flex; flex-direction:column; margin-bottom:10px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <button onclick="simulateMatch('${matchId}', '${hName}', '${aName}')" title="Simular partido" style="background:transparent; border:none; cursor:pointer; font-size:1.2rem;">🎲</button>
                            <span style="font-size:0.8rem; flex:1; text-align:right;">${hName}</span>
                            <div style="display:flex; gap:5px; margin: 0 10px;">
                                <input type="number" class="score-input" id="${hId}" value="${currentData[hId] || ''}" oninput="render()">
                                <input type="number" class="score-input" id="${aId}" value="${currentData[aId] || ''}" oninput="render()">
                            </div>
                            <span style="font-size:0.8rem; flex:1;">${aName}</span>
                        </div>
                        ${matchEvents.length > 0 ? `
                        <div style="font-size:0.7rem; color:rgba(255,255,255,0.6); text-align:center; margin-top:5px;">
                            ${matchEvents.map(e => `
                                <span>${e.time.elapsed}' ${e.player.name} (${e.type === 'Goal' ? '⚽' : (e.detail === 'Red Card' ? '🟥' : '🟨')})</span>
                            `).join(' | ')}
                        </div>
                        ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
              <!-- Tabla en tiempo real -->
              <table class="prediction-standings">
                <thead><tr><th>Pos</th><th>Selección</th><th>Pts</th></tr></thead>
                <tbody>
                  ${standings.map((s, i) => `<tr><td>${i+1}</td><td>${getTeamHtml(s.name)}</td><td>${s.pts}</td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }).join('');

      // 2. Bracket con edición
      const bracketContainer = document.getElementById('fixtureBracket');
      bracketContainer.innerHTML = KNOCKOUT_BRACKET.map(round => `
        <div class="knockout-section">
          <div class="knockout-title">${round.name}</div>
          <div class="knockout-matches">
              ${round.matches.map(num => {
              const pairing = BRACKET_MATCHES[num];
              const hName = fullResolve(pairing[0], currentData);
              const aName = fullResolve(pairing[1], currentData);
              const matchId = `ko_${num}`;
              const hId = `${matchId}_h`;
              const aId = `${matchId}_a`;
              const pHId = `pen_${num}_h`;
              const pAId = `pen_${num}_a`;
              
              const isDraw = currentData[hId] && currentData[aId] && currentData[hId] === currentData[aId];
              const matchEvents = (currentData.events && currentData.events[matchId]) || [];

              return `
                <div class="knockout-match">
                  <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                      <span class="match-number">#${num}</span>
                      <button onclick="simulateMatch('${matchId}', '${hName}', '${aName}')" title="Simular partido" style="background:transparent; border:none; cursor:pointer; font-size:1rem;">🎲</button>
                  </div>
                  <div class="km-teams">
                    <span class="team-name team-home">${getTeamHtml(hName)}</span>
                    <div class="score-container" style="display:flex; flex-direction:column; gap:5px;">
                        <div style="display:flex; gap:5px; align-items:center;">
                            <input type="number" class="score-input" id="${hId}" value="${currentData[hId] || ''}" oninput="render()">
                            <span>–</span>
                            <input type="number" class="score-input" id="${aId}" value="${currentData[aId] || ''}" oninput="render()">
                        </div>
                        ${isDraw ? `
                            <div style="display:flex; gap:2px; font-size:0.6rem; color:var(--accent-gold);">
                                <input type="number" class="score-input" id="${pHId}" placeholder="P" value="${currentData[pHId] || ''}" oninput="render()" style="width:30px !important;">
                                <span>(pen)</span>
                                <input type="number" class="score-input" id="${pAId}" placeholder="P" value="${currentData[pAId] || ''}" oninput="render()" style="width:30px !important;">
                            </div>
                        ` : ''}
                    </div>
                    <span class="team-name team-away">${getTeamHtml(aName)}</span>
                  </div>
                  ${matchEvents.length > 0 ? `
                  <div style="font-size:0.65rem; color:rgba(255,255,255,0.6); text-align:center; margin-top:8px;">
                      ${matchEvents.map(e => `
                          <div>${e.time.elapsed}' ${e.player.name} (${e.type === 'Goal' ? '⚽' : (e.detail === 'Red Card' ? '🟥' : '🟨')})</div>
                      `).join('')}
                  </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');

      // 3. Honor Roll
      const awardsContainer = document.getElementById('awardsContainer');
      const champ = fullResolve('W104', currentData);
      const runner = fullResolve('L104', currentData);
      awardsContainer.innerHTML = `
        <div class="group-card awards-card">
          <div class="group-header">Cuadro de honor</div>
          <table class="awards-table">
            <tr><td>🏆 Campeón</td><td>${getTeamHtml(champ)}</td></tr>
            <tr><td>🥈 Subcampeón</td><td>${getTeamHtml(runner)}</td></tr>
          </table>
        </div>
      `;
    }

    window.render = render;
    init();
  </script>
</body>
</html>
