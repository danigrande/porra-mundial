<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Porra del Mundial 2026 - Introduce tus predicciones de goles">
  <title>Mi predicción - Porra Mundial 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Navigation -->
  <nav class="main-nav">
    <div class="nav-inner">
      <a href="worldcup.html" class="nav-logo">
        <span class="nav-logo-icon">⚽</span>
        <span class="nav-logo-text">Mundial 2026</span>
      </a>
      <div class="nav-links" id="navLinks">
        <!-- Generado dinámicamente -->
      </div>
      <div id="navUserInfo" class="nav-user" style="display:none;">
        <span class="nav-user-name" id="displayUserName"></span>
        <a href="#" onclick="handleLogout()" class="nav-logout">Cerrar Sesión</a>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <h1><span class="header-icon">🏆</span> <span class="header-text-gradient">Mi predicción – Mundial 2026</span></h1>
    <p class="subtitle">Introduce tus predicciones de goles para cada partido</p>
  </header>

  <main class="main-content">
    <div id="userNotification" class="group-card" style="margin-bottom:2rem; background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.2); display:none;">
      <div style="padding: 1rem 1.5rem; display: flex; align-items: center; gap: 12px;">
        <span>👋</span>
        <div style="font-size: 0.9rem; font-weight: 500; color: var(--text-primary);">
          Sesión iniciada como: <strong id="userNameHighlight" style="color:var(--accent-green)"></strong>. 
          Tus predicciones se guardarán automáticamente en la nube.
        </div>
      </div>
    </div>

    <div class="groups-grid" id="groupsGrid"></div>
    <div id="bestThirdContainer"></div>
    <div id="knockoutContainer"></div>
    <div id="awardsContainer"></div>
  </main>

  <div class="save-bar">
    <button class="btn-save" id="btnSave" onclick="saveData()">💾 Guardar predicciones</button>
    <button class="btn-reset" id="btnReset" onclick="resetData()">🗑️ Borrar todo</button>
    <span class="save-status" id="saveStatus">✓ Guardado</span>
  </div>

  <div class="toast" id="toast"></div>
  <div class="page-footer-spacer"></div>

  <script src="web_config.js"></script>
  <script type="module">
    import { checkAuth, handleLogout, showToast, renderNavigation } from './shared_ui.js';
    import { TEAM_CODES, FIXTURE_GROUPS, KNOCKOUT_BRACKET, BRACKET_MATCHES } from './agente_mundial/shared_data.js';
    import { getStandings, fullResolve } from './agente_mundial/scoringEngine.js';
    import { apiCall } from './agente_mundial/dataFetcher.js';

    window.handleLogout = handleLogout;
    renderNavigation('worldcup.html');
    let currentUser = checkAuth();
    let predictions = {};

    // Mapeo extendido para visualización (se podría mover a shared_data si se usa en más sitios)
    const groupMatchesMetadata = FIXTURE_GROUPS.map(g => ({
      ...g,
      matches: [
        { h: 0, a: 1, date: 'Jun', jornada: 'J1' }, { h: 2, a: 3, date: 'Jun', jornada: 'J1' },
        { h: 3, a: 1, date: 'Jun', jornada: 'J2' }, { h: 0, a: 2, date: 'Jun', jornada: 'J2' },
        { h: 3, a: 0, date: 'Jun', jornada: 'J3' }, { h: 1, a: 2, date: 'Jun', jornada: 'J3' }
      ]
    }));

    function getTeamHtml(name) {
      const code = TEAM_CODES[name];
      return code ? `<img src="https://flagcdn.com/w40/${code}.png" class="flag-img"> ${name}` : name;
    }

    async function render() {
      renderGroups();
      renderKnockout();
      renderAwards();
      await loadStoredData();
      updateAll();
    }

    function renderGroups() {
      const grid = document.getElementById('groupsGrid');
      grid.innerHTML = groupMatchesMetadata.map(g => `
        <div class="group-card">
          <div class="group-header">
            <div class="group-letter">${g.letter}</div>
            <div>
              <div class="group-name">Grupo ${g.letter}</div>
              <div class="group-teams-summary">${g.teams.join(' · ')}</div>
            </div>
          </div>
          <div class="group-layout">
            <div class="matches-section">
              <div class="matches-container">
                ${g.matches.map((m, i) => `
                  <div class="match-row">
                    <div class="team-name team-home">${getTeamHtml(g.teams[m.h])}</div>
                    <div class="score-container">
                      <input type="number" class="score-input" id="g${g.letter}_m${i}_h" oninput="handleInputChange()">
                      <span class="score-separator">–</span>
                      <input type="number" class="score-input" id="g${g.letter}_m${i}_a" oninput="handleInputChange()">
                    </div>
                    <div class="team-name team-away">${getTeamHtml(g.teams[m.a])}</div>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="standings-section">
              <table class="prediction-standings">
                <thead><tr><th>Pos</th><th>Selección</th><th>Pts</th><th>DG</th></tr></thead>
                <tbody id="tbody_${g.letter}"></tbody>
              </table>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderKnockout() {
      const container = document.getElementById('knockoutContainer');
      container.innerHTML = KNOCKOUT_BRACKET.map(round => `
        <div class="knockout-section">
          <div class="knockout-title">${round.name}</div>
          <div class="knockout-matches">
            ${round.matches.map(num => `
              <div class="knockout-match">
                <span class="match-number">#${num}</span>
                <div class="km-teams">
                  <span class="team-name team-home" id="team_name_${num}_h">?</span>
                  <div class="score-outer">
                    <div class="score-container">
                      <input type="number" class="score-input ko-input" id="ko_${num}_h" oninput="handleInputChange()">
                      <span class="score-separator">–</span>
                      <input type="number" class="score-input ko-input" id="ko_${num}_a" oninput="handleInputChange()">
                    </div>
                    <div id="pen_container_${num}" class="penalties-container" style="display:none;">
                      <div class="pen-inputs">
                        <input type="number" class="score-input pen-input" id="pen_${num}_h" oninput="handleInputChange()">
                        <span class="score-separator">–</span>
                        <input type="number" class="score-input pen-input" id="pen_${num}_a" oninput="handleInputChange()">
                      </div>
                    </div>
                  </div>
                  <span class="team-name team-away" id="team_name_${num}_a">?</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderAwards() {
      const container = document.getElementById('awardsContainer');
      container.innerHTML = `
        <div class="group-card awards-card">
          <div class="group-header">Cuadro de honor</div>
          <table class="awards-table">
            <tr><td>🏆 Campeón</td><td id="honor_champion">-</td></tr>
            <tr><td>🥈 Subcampeón</td><td id="honor_runnerup">-</td></tr>
          </table>
        </div>
      `;
    }

    function collectData() {
      const data = { _playerName: currentUser.name, _groupName: currentUser.groupName, _updatedAt: new Date().toISOString() };
      document.querySelectorAll('input').forEach(input => {
        if (input.value !== '') data[input.id] = input.value;
      });
      return data;
    }

    window.saveData = async () => {
      const data = collectData();
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.textContent = '⏳ Guardando...';
      
      const res = await apiCall({ action: 'savePredictions', groupName: currentUser.groupName, ...data }, { method: 'POST' });
      
      btn.disabled = false;
      btn.textContent = '💾 Guardar predicciones';
      
      if (res?.status === 'success') {
        localStorage.setItem(`worldcup2026_predictions_${currentUser.groupName}`, JSON.stringify(data));
        showToast('✅ Predicciones guardadas');
      } else {
        showToast('❌ Error al guardar', true);
      }
    };

    async function loadStoredData() {
      // 1. Intentar cargar de LocalStorage primero
      const raw = localStorage.getItem(`worldcup2026_predictions_${currentUser.groupName}`);
      let data = raw ? JSON.parse(raw) : null;

      // 2. Si no hay nada en local o falta el nombre, pedir a la nube (MongoDB)
      if (!data || !data._playerName) {
        console.log("☁️ Cargando predicciones desde MongoDB...");
        const res = await apiCall({ action: 'getPredictions', groupName: currentUser.groupName });
        if (res.status === 'success' && res.data[currentUser.name]) {
          data = res.data[currentUser.name].predictions;
          // Guardar en local para la próxima vez
          localStorage.setItem(`worldcup2026_predictions_${currentUser.groupName}`, JSON.stringify(data));
        }
      }

      if (data) {
        Object.entries(data).forEach(([id, val]) => {
          const el = document.getElementById(id);
          if (el) el.value = val;
        });
        updateAll();
      }
    }

    function updateAll() {
      const currentData = collectData();
      FIXTURE_GROUPS.forEach(g => {
        const standings = getStandings(g.letter, currentData);
        const tbody = document.getElementById(`tbody_${g.letter}`);
        tbody.innerHTML = standings.map((s, i) => `<tr><td>${i+1}</td><td>${getTeamHtml(s.name)}</td><td>${s.pts}</td><td>${s.dg}</td></tr>`).join('');
      });

      KNOCKOUT_BRACKET.forEach(round => {
        round.matches.forEach(num => {
          const pairing = BRACKET_MATCHES[num];
          const hName = fullResolve(pairing[0], currentData);
          const aName = fullResolve(pairing[1], currentData);
          document.getElementById(`team_name_${num}_h`).innerHTML = getTeamHtml(hName);
          document.getElementById(`team_name_${num}_a`).innerHTML = getTeamHtml(aName);
          
          const hVal = currentData[`ko_${num}_h`];
          const aVal = currentData[`ko_${num}_a`];
          document.getElementById(`pen_container_${num}`).style.display = (hVal !== undefined && aVal !== undefined && hVal === aVal) ? 'block' : 'none';
        });
      });

      const champ = fullResolve('W104', currentData);
      const runner = fullResolve('L104', currentData);
      document.getElementById('honor_champion').innerHTML = getTeamHtml(champ);
      document.getElementById('honor_runnerup').innerHTML = getTeamHtml(runner);
    }

    window.handleInputChange = () => {
      updateAll();
      // Auto-save logic could go here
    };

    render();
  </script>
</body>
</html>
