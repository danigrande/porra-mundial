<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Porra del Mundial 2026 - Introduce tus predicciones de goles">
  <title>Mi predicción - Porra Mundial 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Navigation -->
  <nav class="main-nav">
    <div class="nav-inner">
      <a href="player_scores.html" class="nav-logo">
        <span class="nav-logo-icon">⚽</span>
        <span class="nav-logo-text" data-i18n="common.app_title">Mundial 2026</span>
      </a>
      <div class="nav-links" id="navLinks">
        <!-- Generado dinámicamente -->
      </div>
      <div id="navUserInfo" class="nav-user" style="display:none;">
        <span class="nav-user-name" id="displayUserName"></span>
        <a href="#" onclick="handleLogout()" class="nav-logout" data-i18n="common.logout">Cerrar Sesión</a>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <h1><span class="header-icon">🏆</span> <span class="header-text-gradient" data-i18n="predictions.title">Mi predicción – Mundial 2026</span></h1>
    <p class="subtitle" data-i18n="predictions.subtitle">Introduce tus predicciones de goles para cada partido</p>
  </header>

  <main class="main-content">
    <!-- Countdown / Phase Info -->
    <div id="tournamentBanner" class="group-card" style="margin-bottom:2rem; display:none; overflow: hidden; position: relative; border-left: 5px solid var(--accent-blue);">
      <div style="padding: 1.25rem 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div id="phaseIcon" style="font-size: 2rem;">🗓️</div>
          <div>
            <div id="phaseName" style="font-weight: 700; font-size: 1.1rem; color: var(--text-primary);" data-i18n="predictions.phase_loading">Cargando fase...</div>
            <div id="phaseStatus" style="font-size: 0.85rem; color: var(--text-muted);" data-i18n="predictions.tournament_status">Estado del torneo</div>
          </div>
        </div>
        <div id="countdownContainer" style="text-align: right; min-width: 150px;">
          <div style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 2px;" data-i18n="predictions.closing_in">Cierre en:</div>
          <div id="countdownTimer" style="font-family: 'Inter', monospace; font-weight: 800; font-size: 1.5rem; color: var(--accent-blue);">00:00:00</div>
        </div>
      </div>
    </div>

    <div id="userNotification" class="group-card" style="margin-bottom:2rem; background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.2); display:none;">
      <div style="padding: 1rem 1.5rem; display: flex; align-items: center; gap: 12px;">
        <span>👋</span>
        <div style="font-size: 0.9rem; font-weight: 500; color: var(--text-primary);">
          <span data-i18n="common.logged_as">Sesión iniciada como:</span> <strong id="userNameHighlight" style="color:var(--accent-green)"></strong>. 
          <span data-i18n="common.cloud_sync">Tus predicciones se guardarán automáticamente en la nube.</span>
        </div>
      </div>
    </div>

    <div class="groups-grid" id="groupsGrid"></div>
    <div id="bestThirdContainer"></div>
    <div id="knockoutContainer"></div>
    <div id="awardsContainer"></div>
  </main>

  <div class="save-bar">
    <button class="btn-save" id="btnSave" onclick="saveData()">💾 <span data-i18n="common.save_predictions">Guardar predicciones</span></button>
    <span class="save-status" id="saveStatus">✓ <span data-i18n="common.saved">Guardado</span></span>
  </div>

  <div class="toast" id="toast"></div>
  <div class="page-footer-spacer"></div>
  <script src="i18n.js"></script>
  <script src="web_config.js"></script>
  <script type="module">
    import { checkAuth, handleLogout, showToast, renderNavigation, initOnboarding } from './shared_ui.js';
    import { TEAM_CODES, FIXTURE_GROUPS, KNOCKOUT_BRACKET, BRACKET_MATCHES } from './agente_mundial/shared_data.js';
    import { getStandings, fullResolve } from './agente_mundial/scoringEngine.js';
    import { apiCall } from './agente_mundial/dataFetcher.js';

    window.handleLogout = handleLogout;
    renderNavigation('worldcup.html');
    let currentUser = checkAuth();
    initOnboarding('worldcup.html');
    let predictions = {};
    let tournamentState = null;
    let groupRules = {};
    let realityResults = {};


    // Mapeo extendido para visualización (se podría mover a shared_data si se usa en más sitios)
    const groupMatchesMetadata = FIXTURE_GROUPS.map(g => ({
      ...g,
      matches: [
        { h: 0, a: 1, date: 'Jun', jornada: 'J1' }, { h: 2, a: 3, date: 'Jun', jornada: 'J1' },
        { h: 3, a: 1, date: 'Jun', jornada: 'J2' }, { h: 0, a: 2, date: 'Jun', jornada: 'J2' },
        { h: 3, a: 0, date: 'Jun', jornada: 'J3' }, { h: 1, a: 2, date: 'Jun', jornada: 'J3' }
      ]
    }));

    function getTeamHtml(name) {
      const code = TEAM_CODES[name];
      const translatedName = window.i18n ? window.i18n.t(`teams.${name}`) : name;
      return code ? `<img src="https://flagcdn.com/w40/${code}.png" class="flag-img"> ${translatedName}` : translatedName;
    }

    async function render() {
      // 1. Cargar Estado y Reglas primero
      try {
        const [stateRes, rulesRes, realityRes] = await Promise.all([
          apiCall({ action: 'tournament-state' }),
          apiCall({ action: 'getRules', groupName: currentUser.groupName }),
          apiCall({ action: 'getReality' })
        ]);
        
        tournamentState = stateRes?.data || null;
        groupRules = rulesRes || {};
        realityResults = realityRes?.data || {};

        if (tournamentState) {
          updateTournamentUI();
        }
      } catch (e) {
        console.error("Error cargando estado inicial", e);
      }

      renderGroups();
      renderKnockout();
      renderAwards();
      await loadStoredData();
      updateAll();
    }

    function updateTournamentUI() {
      const banner = document.getElementById('tournamentBanner');
      const phaseName = document.getElementById('phaseName');
      const phaseStatus = document.getElementById('phaseStatus');
      
      if (!tournamentState) return;
      
      banner.style.display = 'block';
      const mode = tournamentState.predictionMode || 'A';
      phaseName.innerHTML = `${window.i18n ? window.i18n.t('predictions.round_' + tournamentState.id) : tournamentState.name} <span style="font-size: 0.6rem; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; margin-left: 8px;">MODO ${mode}</span>`;
      
      if (tournamentState.isPredictionWindow) {
        // Validación de cumplimiento
        const isComplete = checkCompliance();
        if (isComplete) {
          phaseStatus.innerHTML = `✅ <span style="color: var(--accent-green); font-weight: 700;">¡Todo listo!</span> Tus predicciones están registradas.`;
          banner.style.borderColor = "var(--accent-green)";
          banner.style.background = "rgba(16, 185, 129, 0.05)";
        } else {
          phaseStatus.innerHTML = `🚨 <span style="color: var(--accent-red); font-weight: 700;">¡Pendiente!</span> Tienes partidos sin pronosticar para esta fase.`;
          banner.style.borderColor = "var(--accent-red)";
          banner.style.background = "rgba(239, 68, 68, 0.05)";
        }
        startCountdown();
      } else {
        if (tournamentState.id === 'POST_TOURNAMENT') {
          phaseStatus.innerHTML = `🏁 <span style="color: var(--accent-red); font-weight: 700;">Torneo Finalizado</span>`;
          banner.style.borderColor = "var(--accent-red)";
          banner.style.background = "rgba(239, 68, 68, 0.05)";
          document.getElementById('countdownContainer').innerHTML = `<div style="font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">ESTADO:</div><div style="font-weight: 800; font-size: 1.1rem; color: var(--accent-red); margin-top: 5px;">FINALIZADO</div>`;
        } else {
          phaseStatus.innerHTML = `🔒 <span data-i18n="predictions.locked">Fase bloqueada (Partidos en curso)</span>`;
          banner.style.borderColor = "var(--border-color)";
          banner.style.background = "var(--bg-card)";
          document.getElementById('countdownContainer').innerHTML = `<div style="font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">PRÓXIMA VENTANA:</div><div style="font-weight: 800; font-size: 1rem; color: var(--text-muted); margin-top: 5px;">${tournamentState.nextDeadline ? new Date(tournamentState.nextDeadline).toLocaleDateString() : 'Pendiente'}</div>`;
        }
      }
    }

    function checkCompliance() {
      if (!tournamentState) return false;
      
      const mode = tournamentState.predictionMode || 'A';
      const phaseId = tournamentState.id;
      const unlocks = tournamentState.unlocks || [];
      let missing = false;

      // 1. Validar Partidos
      const matchInputs = document.querySelectorAll('input.score-input');
      
      if (phaseId === 'PRE_TOURNAMENT') {
          // En 2026: 12 grupos * 6 partidos/grupo * 2 campos/partido = 144 campos
          if (matchInputs.length < 144) missing = true;
          
          matchInputs.forEach(input => {
            const val = input.value.trim();
            const id = input.id;
            if (mode === 'A') {
              if (val === '') missing = true;
            } else {
              if (id.startsWith('g') && val === '') missing = true;
            }
          });
          
          // Si es modo A, validar que existan los de eliminatorias (32 partidos * 2 = 64)
          if (mode === 'A') {
             const koInputs = document.querySelectorAll('input.score-input[id^="ko_"]');
             if (koInputs.length < 64) missing = true;
          }
      } else {
          // Durante el torneo, validamos los campos que no estén bloqueados
          if (matchInputs.length === 0) missing = true;
          matchInputs.forEach(input => {
            if (!input.disabled && input.value.trim() === '') missing = true;
          });
      }

      // 2. Validar Premios
      if (phaseId === 'PRE_TOURNAMENT' || unlocks.includes('honor')) {
        const awardIds = ['boot_gold', 'boot_silver', 'boot_bronze', 'ball_gold', 'ball_silver', 'ball_bronze'];
        awardIds.forEach(id => {
          const el = document.getElementById(id);
          if (!el || el.value.trim() === '') missing = true;
        });
      }

      return !missing;
    }

    function handleInputChange() {
      // Cada vez que el usuario escribe, refrescamos el banner
      updateTournamentUI();
    }

    function startCountdown() {
      const deadline = new Date(tournamentState.nextDeadline).getTime();
      
      const timer = setInterval(() => {
        const now = Date.now();
        const diff = deadline - now;
        
        if (diff <= 0) {
          clearInterval(timer);
          document.getElementById('countdownTimer').textContent = "CERRADO";
          return;
        }
        
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        
        const daysPart = d > 0 ? `${d}d ` : '';
        document.getElementById('countdownTimer').textContent = 
          `${daysPart}${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
      }, 1000);
    }


    function renderGroups() {
      const grid = document.getElementById('groupsGrid');
      grid.innerHTML = groupMatchesMetadata.map(g => `
        <div class="group-card">
          <div class="group-header">
            <div class="group-letter">${g.letter}</div>
            <div>
              <div class="group-name"><span data-i18n="predictions.group">Grupo</span> ${g.letter}</div>
              <div class="group-teams-summary">${g.teams.join(' · ')}</div>
            </div>
          </div>
          <div class="group-layout">
            <div class="matches-section">
              <div class="matches-container">
                ${g.matches.map((m, i) => `
                  <div class="match-row">
                    <div class="team-name team-home">${getTeamHtml(g.teams[m.h])}</div>
                    <div class="score-container">
                      <input type="number" class="score-input" id="g${g.letter}_m${i}_h" oninput="handleInputChange()">
                      <span class="score-separator">–</span>
                      <input type="number" class="score-input" id="g${g.letter}_m${i}_a" oninput="handleInputChange()">
                    </div>
                    <div class="team-name team-away">${getTeamHtml(g.teams[m.a])}</div>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="standings-section">
              <table class="prediction-standings">
                <thead><tr><th data-i18n="dashboard.pos">Pos</th><th data-i18n="predictions.teams">Selección</th><th data-i18n="predictions.pts">Pts</th><th data-i18n="predictions.dg">DG</th></tr></thead>
                <tbody id="tbody_${g.letter}"></tbody>
              </table>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderKnockout() {
      const container = document.getElementById('knockoutContainer');
      container.innerHTML = KNOCKOUT_BRACKET.map(round => `
        <div class="knockout-section">
          <div class="knockout-title" data-i18n="predictions.round_${round.id}">${round.name}</div>
          <div class="knockout-matches">
            ${round.matches.map(num => `
              <div class="knockout-match">
                <span class="match-number">#${num}</span>
                <div class="km-teams">
                  <span class="team-name team-home" id="team_name_${num}_h">?</span>
                  <div class="score-outer">
                    <div class="score-container">
                      <input type="number" class="score-input ko-input" id="ko_${num}_h" oninput="handleInputChange()">
                      <span class="score-separator">–</span>
                      <input type="number" class="score-input ko-input" id="ko_${num}_a" oninput="handleInputChange()">
                    </div>
                    <div id="pen_container_${num}" class="penalties-container" style="display:none;">
                      <div class="pen-inputs">
                        <input type="number" class="score-input pen-input" id="pen_${num}_h" oninput="handleInputChange()">
                        <span class="score-separator">–</span>
                        <input type="number" class="score-input pen-input" id="pen_${num}_a" oninput="handleInputChange()">
                      </div>
                    </div>
                  </div>
                  <span class="team-name team-away" id="team_name_${num}_a">?</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderAwards() {
      const container = document.getElementById('awardsContainer');
      container.innerHTML = `
        <div class="group-card awards-card">
          <div class="group-header" data-i18n="predictions.honor_title">🏆 Cuadro de honor y Premios</div>
          <div style="padding: 1.25rem;">
            <table class="prediction-standings" style="text-align: left;">
              <thead>
                <tr><th colspan="2" style="font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); padding-bottom: 10px;" data-i18n="predictions.tournament_final">Torneo Final</th></tr>
              </thead>
              <tbody>
                <tr><td><strong>🥇 <span data-i18n="predictions.champion">Campeón</span></strong></td><td id="honor_champion" style="font-weight: 700; color: var(--accent-gold);">-</td></tr>
                <tr><td><strong>🥈 <span data-i18n="predictions.runnerup">Subcampeón</span></strong></td><td id="honor_runnerup" style="font-weight: 600; color: #d1d5db;">-</td></tr>
              </tbody>
            </table>

            <div style="margin-top: 1.5rem;">
              <table class="prediction-standings" style="text-align: left;">
                <thead>
                  <tr><th colspan="2" style="font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); padding-bottom: 10px;" data-i18n="predictions.individual_prizes">Premios Individuales</th></tr>
                </thead>
                <tbody>
                  <tr>
                    <td><strong>⚽ <span data-i18n="predictions.boot_gold">Bota de Oro</span></strong><br><small data-i18n="predictions.top_scorer">Máximo Goleador</small></td>
                    <td><input type="text" class="score-input" id="boot_gold" placeholder="Nombre..." data-i18n-placeholder="predictions.placeholder_name" oninput="handleInputChange()" style="width: 150px !important; text-align: left; padding: 8px !important;"></td>
                  </tr>
                  <tr>
                    <td><strong>🥈 <span data-i18n="predictions.boot_silver">Bota de Plata</span></strong></td>
                    <td><input type="text" class="score-input" id="boot_silver" placeholder="Nombre..." data-i18n-placeholder="predictions.placeholder_name" oninput="handleInputChange()" style="width: 150px !important; text-align: left; padding: 8px !important;"></td>
                  </tr>
                  <tr>
                    <td><strong>🥉 <span data-i18n="predictions.boot_bronze">Bota de Bronce</span></strong></td>
                    <td><input type="text" class="score-input" id="boot_bronze" placeholder="Nombre..." data-i18n-placeholder="predictions.placeholder_name" oninput="handleInputChange()" style="width: 150px !important; text-align: left; padding: 8px !important;"></td>
                  </tr>
                  <tr style="border-top: 1px solid rgba(255,255,255,0.05);">
                    <td style="padding-top: 15px;"><strong>🌟 <span data-i18n="predictions.ball_gold">Balón de Oro</span></strong><br><small data-i18n="predictions.best_player">Mejor Jugador</small></td>
                    <td style="padding-top: 15px;"><input type="text" class="score-input" id="ball_gold" placeholder="Nombre..." data-i18n-placeholder="predictions.placeholder_name" oninput="handleInputChange()" style="width: 150px !important; text-align: left; padding: 8px !important;"></td>
                  </tr>
                  <tr>
                    <td><strong>🥈 <span data-i18n="predictions.ball_silver">Balón de Plata</span></strong></td>
                    <td><input type="text" class="score-input" id="ball_silver" placeholder="Nombre..." data-i18n-placeholder="predictions.placeholder_name" oninput="handleInputChange()" style="width: 150px !important; text-align: left; padding: 8px !important;"></td>
                  </tr>
                  <tr>
                    <td><strong>🥉 <span data-i18n="predictions.ball_bronze">Balón de Bronce</span></strong></td>
                    <td><input type="text" class="score-input" id="ball_bronze" placeholder="Nombre..." data-i18n-placeholder="predictions.placeholder_name" oninput="handleInputChange()" style="width: 150px !important; text-align: left; padding: 8px !important;"></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function collectData() {
      const data = { _playerName: currentUser.name, _groupName: currentUser.groupName, _updatedAt: new Date().toISOString() };
      document.querySelectorAll('input').forEach(input => {
        if (input.value !== '') data[input.id] = input.value;
      });
      return data;
    }

    window.saveData = async () => {
      const data = collectData();
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.textContent = '⏳ Guardando...';
      
      const res = await apiCall({ action: 'savePredictions', groupName: currentUser.groupName, ...data }, { method: 'POST' });
      
      btn.disabled = false;
      btn.textContent = '💾 Guardar predicciones';
      
      if (res?.status === 'success') {
        localStorage.setItem(`worldcup2026_predictions_${currentUser.groupName}`, JSON.stringify(data));
        showToast('✅ Predicciones guardadas');
      } else {
        showToast('❌ Error al guardar', true);
      }
    };

    async function loadStoredData() {
      console.log("☁️ Sincronizando predicciones con la nube...");
      try {
        const res = await apiCall({ action: 'getPredictions', groupName: currentUser.groupName });
        
        if (res.status === 'success' && res.data[currentUser.name]) {
          const cloudData = res.data[currentUser.name].predictions;
          localStorage.setItem(`worldcup2026_predictions_${currentUser.groupName}`, JSON.stringify(cloudData));
          applyDataToUI(cloudData);
        } else {
          // Si el servidor no tiene datos para este usuario, limpiamos el local 
          // (importante para cuando el admin resetea el modo de juego)
          console.log("ℹ️ No hay predicciones en la nube para este usuario. Limpiando cache local.");
          localStorage.removeItem(`worldcup2026_predictions_${currentUser.groupName}`);
          clearUI();
        }
      } catch (e) {
        console.error("Error cargando desde la nube, intentando fallback local...", e);
        const raw = localStorage.getItem(`worldcup2026_predictions_${currentUser.groupName}`);
        if (raw) applyDataToUI(JSON.parse(raw));
      }
    }

    function applyDataToUI(data) {
      if (!data) return;
      Object.entries(data).forEach(([id, val]) => {
        const el = document.getElementById(id);
        if (el) el.value = val;
      });
      updateAll();
    }

    function clearUI() {
      document.querySelectorAll('input').forEach(input => {
        if (input.type === 'number' || input.type === 'text') {
          input.value = '';
        }
      });
      updateAll();
    }

    function updateAll() {
      const currentData = collectData();
      const isModeB = groupRules.prediction_mode === 'B';
      const visiblePhases = tournamentState?.visiblePhases || [];
      const unlocks = tournamentState?.unlocks || [];

      // Fusionar predicciones con realidad para el Cuadro en Modo B
      const dataForBracket = { ...currentData };
      if (isModeB) {
        // En modo B, los nombres de los equipos en el cuadro vienen de la REALIDAD si la fase ha pasado
        Object.keys(realityResults).forEach(key => {
          dataForBracket[key] = realityResults[key];
        });
      }

      FIXTURE_GROUPS.forEach(g => {
        const standings = getStandings(g.letter, currentData);
        const tbody = document.getElementById(`tbody_${g.letter}`);
        tbody.innerHTML = standings.map((s, i) => `<tr><td>${i+1}</td><td>${getTeamHtml(s.name)}</td><td>${s.pts}</td><td>${s.dg}</td></tr>`).join('');
        
        // Bloquear inputs si no están en 'unlocks' o si la fase de grupos ya pasó
        const isGroupUnlock = unlocks.includes('groups');
        const card = tbody.closest('.group-card');
        if (!isGroupUnlock && tournamentState) {
          card.querySelectorAll('input').forEach(input => input.disabled = true);
          card.style.opacity = '0.8';
        }
      });

      KNOCKOUT_BRACKET.forEach(round => {
        const isRoundVisible = !isModeB || visiblePhases.includes(round.id.toLowerCase()) || round.matches.some(m => unlocks.includes('r'+m) || unlocks.includes(round.id.toLowerCase()));
        const section = document.querySelector(`.knockout-section:nth-of-type(${KNOCKOUT_BRACKET.indexOf(round) + 1})`);
        
        // En modo B, ocultamos rondas que aún no "existen"
        if (isModeB && !isRoundVisible) {
           if (section) section.style.display = 'none';
        } else if (section) {
           section.style.display = 'block';
           
           // Bloquear si no es editable
           const isEditable = unlocks.includes(round.id.toLowerCase()) || round.matches.some(m => unlocks.includes('r'+m));
           if (!isEditable && tournamentState) {
             section.querySelectorAll('input').forEach(input => input.disabled = true);
             section.style.opacity = '0.9';
           }
        }

        round.matches.forEach(num => {
          const pairing = BRACKET_MATCHES[num];
          // IMPORTANTE: En modo B usamos dataForBracket (Realidad) para resolver nombres
          const hName = fullResolve(pairing[0], dataForBracket);
          const aName = fullResolve(pairing[1], dataForBracket);
          
          const hEl = document.getElementById(`team_name_${num}_h`);
          const aEl = document.getElementById(`team_name_${num}_a`);
          if (hEl) hEl.innerHTML = getTeamHtml(hName);
