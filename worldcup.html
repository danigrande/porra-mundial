    let isSaving = false;

    async function saveData() {
      if (isSaving) return;

      const nameInput = document.getElementById('playerName');
      const nameError = document.getElementById('nameError');
      const name = nameInput.value.trim();

      if (!name) {
        nameError.style.display = 'block';
        nameInput.style.borderColor = 'var(--accent-red)';
        nameInput.style.boxShadow = '0 0 0 3px rgba(239, 68, 68, 0.2)';
        nameInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        showToast('⚠️ Introduce tu nombre antes de guardar');
        return;
      }

      nameError.style.display = 'none';
      nameInput.style.borderColor = 'var(--accent-green)';
      nameInput.style.boxShadow = '0 0 0 3px rgba(16, 185, 129, 0.2)';

      const data = { _playerName: name };
      document.querySelectorAll('.score-input').forEach(input => {
        if (input.id !== 'playerName' && input.value !== '') {
          data[input.id] = input.value;
        }
      });

      // Guardado local (backup instantáneo)
      localStorage.setItem('worldcup2026_predictions', JSON.stringify(data));
      document.getElementById('saveStatus').textContent = 'Guardado localmente';

      // Si no hay URL configurada, paramos aquí
      if (!SCRIPT_URL || SCRIPT_URL === 'TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI') {
        showToast('✓ Predicciones guardadas en tu navegador');
        return;
      }

      // Guardado en la nube (Google Sheets)
      isSaving = true;
      document.getElementById('btnSave').textContent = '⏳ Guardando en la nube...';
      document.getElementById('btnSave').style.opacity = '0.7';

      try {
        const payload = {
          action: 'save',
          playerName: name,
          predictions: data
        };

        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' } // text/plain to avoid CORS preflight
        });

        const result = await response.json();
        if (result.status === 'success') {
          showToast('✓ Guardado en la nube correctamente');
          document.getElementById('saveStatus').textContent = '☁️ Sincronizado';
        } else {
          throw new Error(result.message);
        }
      } catch (error) {
        console.error('Error saving to cloud:', error);
        showToast('⚠️ Error guardando en la nube. Se ha guardado en tu navegador.');
      } finally {
        isSaving = false;
        document.getElementById('btnSave').textContent = '💾 Guardar predicciones';
        document.getElementById('btnSave').style.opacity = '1';
      }
    }



    function loadData() {
      const raw = localStorage.getItem('worldcup2026_predictions');
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        if (data._playerName) {
          document.getElementById('playerName').value = data._playerName;
        }
        Object.entries(data).forEach(([id, val]) => {
          if (id === '_playerName') return;
          const el = document.getElementById(id);
          if (el) el.value = val;
        });
      } catch (e) { /* ignore */ }
    }

    function resetData() {
      if (confirm('¿Estás seguro de que quieres borrar todas las predicciones?')) {
        localStorage.removeItem('worldcup2026_predictions');
        document.querySelectorAll('.score-input').forEach(input => input.value = '');
        document.getElementById('playerName').value = '';
        document.getElementById('nameError').style.display = 'none';
        showToast('🗑️ Predicciones borradas');
      }
    }

    let autoSaveTimer;
    function autoSave() {
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        saveData();
      }, 1000);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ============================================
    // INIT
    // ============================================
    renderGroups();
    renderKnockout();
    loadData();
  </script>
</body>

</html>
