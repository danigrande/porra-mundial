<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Configuración de Puntuaciones - Porra Mundial 2026">
  <title>Configuración - Porra Mundial 2026</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-notice {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #d97706;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
    }
    input:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      background-color: var(--bg-body);
    }
  </style>
</head>

<body>

  <!-- Navigation -->
  <nav class="main-nav">
    <div class="nav-inner">
      <a href="player_scores.html" class="nav-logo">
        <span class="nav-logo-icon">⚽</span>
        <span class="nav-logo-text">Mundial 2026</span>
      </a>
      <div class="nav-links" id="navLinks">
        <!-- Generado dinámicamente -->
      </div>
      <div id="navUserInfo" class="nav-user" style="display:none;">
        <span class="nav-user-name" id="displayUserName"></span>
        <a href="#" onclick="handleLogout()" class="nav-logout">Cerrar Sesión</a>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <header class="page-header">
    <h1><span class="header-icon">👥</span> <span class="header-text-gradient">Configuración del Grupo</span></h1>
    <p class="subtitle" id="pageSubtitle">Gestiona los miembros de tu grupo y la administración</p>
  </header>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Gestión de Miembros (Solo Admin) -->
    <div id="memberManagement" class="group-card" style="display:none; margin-bottom: 2rem; border: 1px solid var(--border-color);">
      <div class="group-header" style="background: var(--gradient-secondary); border-radius: 12px 12px 0 0;">
        <div class="group-letter">👤</div>
        <div>
          <div class="group-name">Miembros del Grupo</div>
          <div class="group-teams-summary">Añadir o quitar jugadores y traspasar mando</div>
        </div>
      </div>
      <div style="padding: 1.25rem; display: flex; gap: 10px;">
        <input type="text" id="newPlayerName" placeholder="Nombre del nuevo usuario" style="flex: 1; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-primary);">
        <button onclick="addPlayerToGroup()" class="btn-cloud" style="margin: 0; padding: 0.75rem 1.5rem;">
          <span class="icon">➕</span>
          <span>Añadir</span>
        </button>
      </div>
      <div id="memberListContainer" style="padding: 0 1.25rem 1.25rem 1.25rem; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 0.5rem; display: none;">
        <div style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 1rem; padding-top: 1rem;">Miembros actuales</div>
        <div id="memberList" style="display: flex; flex-direction: column; gap: 8px;">
          <!-- Cargado dinámicamente -->
        </div>
      </div>
    </div>

  </main>

  <div class="page-footer-spacer" style="height:4rem;"></div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="web_config.js"></script>
  <script type="module">
    import { checkAuth, handleLogout, showToast as sharedToast, renderNavigation } from './shared_ui.js';
    import { apiCall } from './agente_mundial/dataFetcher.js';

    window.handleLogout = handleLogout;
    window.addPlayerToGroup = addPlayerToGroup;
    window.removePlayerFromGroup = removePlayerFromGroup;
    window.transferAdminRole = transferAdminRole;

    renderNavigation('scoring_criteria.html');
    let currentUser = checkAuth();

    function showToast(msg) { sharedToast(msg); }

    function checkAuthWrapper() {
      if (!currentUser) return;
      document.getElementById('displayUserName').textContent = `${currentUser.name} (${currentUser.groupName})`;
      
      if (!currentUser.isAdmin) {
        // Esta página es solo para admins, si llegase un usuario normal le mandamos fuera
        window.location.href = 'player_scores.html';
      }
    }

    function enableMemberManagement() {
      if (currentUser && currentUser.isAdmin) {
        document.getElementById('memberManagement').style.display = 'block';
        fetchMemberList();
      }
    }

    async function fetchMemberList() {
      if (!currentUser || !currentUser.isAdmin) return;
      const listEl = document.getElementById('memberList');
      const container = document.getElementById('memberListContainer');
      
      try {
        const result = await apiCall({ action: 'getPlayers', groupName: currentUser.groupName });
        
        if (result?.status === 'success' && result.data) {
          container.style.display = 'block';
          const players = result.data;
          if (players.length === 0) {
            listEl.innerHTML = '<div style="color:var(--text-muted); font-size:0.9rem;">No hay otros miembros</div>';
            return;
          }
          
          listEl.innerHTML = players.map(name => `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; background: rgba(255,255,255,0.03); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
              <span style="font-weight: 600; color: var(--text-secondary);">${name} ${name === currentUser.name ? '<small style="color:var(--accent-gold); margin-left:5px;">(Tú)</small>' : ''}</span>
              <div style="display:flex; gap:8px;">
                ${name !== currentUser.name ? `
                  <button onclick="window.transferAdminRole('${name}')" style="background: rgba(245, 158, 11, 0.1); color: #d97706; border: 1px solid rgba(245, 158, 11, 0.2); padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; cursor: pointer; font-weight: 700; transition: all 0.2s;">
                    👑 Traspasar
                  </button>
                  <button onclick="window.removePlayerFromGroup('${name}')" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; cursor: pointer; font-weight: 700; transition: all 0.2s;">
                    Quitar
                  </button>
                ` : '<span style="font-size:0.7rem; color:var(--text-muted)">Admin</span>'}
              </div>
            </div>
          `).join('');
        }
      } catch (e) {
        console.error("Error cargando lista de miembros", e);
      }
    }

    async function removePlayerFromGroup(name) {
      if (!confirm(`¿Estás seguro de que quieres quitar a "${name}" del grupo? Se borrarán también sus predicciones.`)) {
        return;
      }

      try {
        const result = await apiCall({
          action: 'removePlayer',
          playerName: name,
          groupName: currentUser.groupName
        }, { method: 'DELETE' });
        
        if (result?.status === 'success') {
          showToast(`✅ ${name} eliminado del grupo`);
          fetchMemberList();
        } else {
          showToast('❌ ' + (result?.message || 'Error'));
        }
      } catch (e) {
        showToast('❌ Error al eliminar jugador');
      }
    }

    async function transferAdminRole(targetName) {
      if (!confirm(`⚠️ ATENCIÓN: Estás a punto de traspasar el mando del grupo a "${targetName}".\n\nSi aceptas, PERDERÁS inmediatamente todos tus privilegios de administrador y ya no podrás modificar la configuración ni gestionar miembros.\n\n¿Quieres continuar?`)) {
        return;
      }

      try {
        const result = await apiCall({
          action: 'transferAdmin',
          targetName,
          groupName: currentUser.groupName
        });
        
        if (result?.status === 'success') {
          showToast(`👑 Traspaso completado. ${targetName} es el nuevo admin.`);
          
          // Actualizar sesión local
          currentUser.isAdmin = false;
          localStorage.setItem('worldcup2026_user', JSON.stringify(currentUser));
          
          // Redirigir ya que no tiene permisos aquí
          setTimeout(() => {
            window.location.href = 'player_scores.html';
          }, 2000);
        } else {
          showToast('❌ ' + (result?.message || 'Error'));
        }
      } catch (e) {
        showToast('❌ Error en el traspaso');
      }
    }

    async function addPlayerToGroup() {
      const nameInput = document.getElementById('newPlayerName');
      const playerName = nameInput.value.trim();
      
      if (!playerName) {
        showToast('❌ Por favor, introduce un nombre');
        return;
      }

      const btn = document.querySelector('#memberManagement button');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span>⏳ Añadiendo...</span>';

      try {
        const result = await apiCall({
          action: 'addPlayer',
          playerName: playerName,
          groupName: currentUser.groupName
        }, { method: 'POST' });
        
        if (result?.status === 'success') {
          showToast('✅ Jugador añadido correctamente');
          nameInput.value = '';
          fetchMemberList();
        } else {
          showToast('❌ ' + (result?.message || 'Error'));
        }
      } catch (e) {
        console.error("Error añadiendo jugador", e);
        showToast('❌ Error al conectar con el servidor');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    checkAuthWrapper();
    enableMemberManagement();
  </script>
</body>
</html>
