services:
  # ---------------------------------------------------------------------------
  # BACKEND: Agente Mundial (Node.js Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: agente-mundial-backend
    env: node
    plan: free
    region: frankfurt # Oregón por defecto si no se especifica
    rootDir: agente_mundial
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GROQ_API_KEY
        sync: false # Configurar manualmente en el dashboard por seguridad
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: MONGODB_URI
        sync: false # Configurar manualmente en el dashboard
      - key: HUGGINGFACEHUB_API_KEY
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: DEV_DASHBOARD_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false # Configurar manualmente en el dashboard (obtener gratis en tavily.com)
      - key: GIPHY_API_KEY
        value: XszfwZBVBmHmmFMxmAQqY1VuQu8YDUsR
      - key: ZAFRONIX_API_KEY
        value: zwc_free_ceefb1eb2e870ff70f45ac47
      # Email (Brevo API) para recuperación de contraseña
      - key: BREVO_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: prediccion.mundial.app@gmail.com

  # ---------------------------------------------------------------------------
  # FRONTEND: Porra Mundial (Static Site)
  # ---------------------------------------------------------------------------
  - type: static
    name: porra-mundial-frontend
    env: static
    plan: free
    publishDir: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /api/*
        destination: https://porra-mundial.onrender.com/api/* # Proxy a tu backend
