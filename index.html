<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Porra Mundial 2026</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-msg {
      color: var(--accent-red);
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      animation: fadeIn 0.3s ease;
    }

    .error-msg::before {
      content: '⚠️';
    }

    .input-error {
      border-color: var(--accent-red) !important;
      background-color: rgba(239, 68, 68, 0.05) !important;
      animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
    }

    @keyframes shake {

      10%,
      90% {
        transform: translate3d(-1px, 0, 0);
      }

      20%,
      80% {
        transform: translate3d(2px, 0, 0);
      }

      30%,
      50%,
      70% {
        transform: translate3d(-4px, 0, 0);
      }

      40%,
      60% {
        transform: translate3d(4px, 0, 0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .group-info-msg {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Language switcher */
    .lang-selector-floating {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
      border-color: var(--accent-blue);
      transform: translateY(-1px);
    }

    .lang-btn.active {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }
  </style>
</head>

<body class="login-page">
  <div class="lang-selector-floating">
    <button class="lang-btn" data-lang="es" onclick="window.i18n.changeLanguage('es')">🇪🇸 ES</button>
    <button class="lang-btn" data-lang="en" onclick="window.i18n.changeLanguage('en')">🇬🇧 EN</button>
  </div>
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">⚽</div>
      <h1 class="login-title"><span data-i18n="login.welcome">Bienvenido a</span> <span data-i18n="login.title">Porra Mundial 2026</span></h1>
      <p class="login-subtitle" id="formSubtitle" data-i18n="login.subtitle">Inicia sesión para ver tu clasificación    <!-- Login Form -->
    <div id="loginForm">
      <div class="form-group">
        <label class="form-label" for="loginEmail" data-i18n="login.email_label">Tu Correo Electrónico</label>
        <input type="email" id="loginEmail" class="login-input" data-i18n-placeholder="login.email_placeholder" placeholder="ejemplo@email.com" autocomplete="on">
        <p id="playerStatus" class="group-info-msg"></p>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginGroupSelect" data-i18n="login.group_label">Selecciona tu grupo</label>
        <select id="loginGroupSelect" class="login-input">
          <option value=""><span data-i18n="admin.group_prompt">Primero introduce tu email...</span></option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword" data-i18n="login.password_label">Tu contraseña</label>
        <div class="pin-container">
          <input type="password" id="loginPassword" class="login-input" data-i18n-placeholder="login.password_placeholder" placeholder="••••••••">
          <button type="button" class="pin-toggle" id="togglePinLogin">👁️</button>
        </div>
        <p id="loginPinError" class="error-msg" style="display:none;"></p>
      </div>
      <button class="login-btn btn-primary" id="btnLogin"><span data-i18n="login.login_btn">Entrar</span><span class="icon">➜</span></button>
      <div class="login-switch"><span data-i18n="login.no_account">¿Quieres crear un grupo?</span> <span id="switchToRegister" data-i18n="login.create_account">Hazlo aquí</span></div>
    </div>

    <!-- Register Form -->
    <div id="registerForm" style="display: none;">
      <div class="form-group">
        <label class="form-label" for="regGroup" data-i18n="login.group_label">Nombre del Grupo</label>
        <input type="text" id="regGroup" class="login-input" data-i18n-placeholder="login.group_placeholder" placeholder="Ej: Los Sharks">
      </div>
      <div class="form-group">
        <label class="form-label" for="regName" data-i18n="login.name_label">Tu nombre (cómo te verán los demás)</label>
        <input type="text" id="regName" class="login-input" data-i18n-placeholder="login.name_placeholder" placeholder="Ej: Pepito Pérez">
      </div>
      <div class="form-group">
        <label class="form-label" for="regEmail" data-i18n="login.email_label">Tu Correo Electrónico</label>
        <input type="email" id="regEmail" class="login-input" data-i18n-placeholder="login.email_placeholder" placeholder="ejemplo@email.com" autocomplete="on">
      </div>
      <div class="form-group">
        <label class="form-label" for="regPassword" data-i18n="login.password_label">Contraseña (Mínimo 8 caracteres)</label>
        <div class="pin-container">
          <input type="password" id="regPassword" class="login-input" data-i18n-placeholder="login.password_placeholder" placeholder="••••••••">
          <button type="button" class="pin-toggle" id="togglePinReg">👁️</button>
        </div>
        <p id="regPinError" class="error-msg" style="display:none;"></p>
      </div>
      <button class="login-btn btn-primary" id="btnRegister"><span data-i18n="login.register_btn">Crear cuenta</span><span
          class="icon">✨</span></button>
      <div class="login-switch"><span data-i18n="login.has_account">¿Ya tienes cuenta?</span> <span id="switchToLogin" data-i18n="login.login_here">Inicia sesión</span></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="i18n.js"></script>
  <script src="web_config.js"></script>
  <script type="module">
    import { showToast } from './shared_ui.js';
    import { apiCall } from './agente_mundial/dataFetcher.js';

    // ==========================================
    // LOGIN — Buscar grupos por email
    // ==========================================
    const loginEmail = document.getElementById('loginEmail');
    const loginGroup = document.getElementById('loginGroupSelect');
    const loginPassword = document.getElementById('loginPassword');
    const playerStatus = document.getElementById('playerStatus');

    let debounceTimer;
    loginEmail.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        const email = loginEmail.value.trim().toLowerCase();
        if (!email || !email.includes('@')) {
          loginGroup.innerHTML = '<option value=""><span data-i18n="admin.group_prompt">Primero introduce tu email...</span></option>';
          playerStatus.textContent = '';
          return;
        }
        playerStatus.textContent = '🔍 Buscando tus grupos...';
        const res = await apiCall({ action: 'getGroupsForPlayer', email });
        if (res?.status === 'success') {
          if (res.data.length === 0) {
            loginGroup.innerHTML = '<option value="">Email no encontrado</option>';
            playerStatus.textContent = '⚠️ No encuentro ningún grupo con ese email.';
          } else {
            loginGroup.innerHTML = res.data.length > 1 ? '<option value="">-- Selecciona tu grupo --</option>' : '';
            res.data.forEach(g => loginGroup.add(new Option(g, g)));
            playerStatus.textContent = `✅ ¡Te he encontrado en ${res.data.length} grupo(s)!`;
          }
        } else {
          playerStatus.textContent = '❌ Error de conexión';
        }
      }, 500);
    });

    // ==========================================
    // LOGIN — Enviar
    // ==========================================
    document.getElementById('btnLogin').onclick = async () => {
      const email = loginEmail.value.trim().toLowerCase();
      const group = loginGroup.value;
      const password = loginPassword.value;

      if (!email || !group || !password) {
        showToast('⚠️ Completa todos los campos', true);
        return;
      }
      if (password.length < 8) {
        showToast('⚠️ La contraseña debe tener al menos 8 caracteres', true);
        return;
      }
      const res = await apiCall({ action: 'login', email, password, groupName: group }, { method: 'POST' });
      if (res?.status === 'success') {
        localStorage.setItem('worldcup2026_user', JSON.stringify({
          email,
          name: res.data.name,
          userId: res.data.userId,
          groupName: group,
          isAdmin: res.data.isAdmin
        }));
        showToast('✅ Login correcto');

        // Si es primera vez (no admin, no ha completado onboarding), iniciar tour
        const onboardingDone = localStorage.getItem('worldcup2026_onboarding_done');
        if (!res.data.isAdmin && !onboardingDone) {
          localStorage.setItem('worldcup2026_onboarding', '1');
          setTimeout(() => window.location.href = 'about_user.html', 1000);
        } else {
          setTimeout(() => window.location.href = 'player_scores.html', 1000);
        }
      } else {
        showToast('❌ ' + (res?.message || 'Error'), true);
      }
    };

    // Toggle Password Visibility
    const toggle = (id) => {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    };
    document.getElementById('togglePinLogin').onclick = () => toggle('loginPassword');
    document.getElementById('togglePinReg').onclick = () => toggle('regPassword');

    // Switch Forms
    const switchF = (type) => {
      document.getElementById('loginForm').style.display = type === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = type === 'register' ? 'block' : 'none';
      document.getElementById('formSubtitle').textContent = type === 'login' ? 'Inicia sesión' : 'Regístrate';
    };
    document.getElementById('switchToRegister').onclick = () => switchF('register');
    document.getElementById('switchToLogin').onclick = () => switchF('login');

    // ==========================================
    // REGISTRO — Crear cuenta con email
    // ==========================================
    document.getElementById('btnRegister').onclick = async () => {
      const g = document.getElementById('regGroup').value.trim();
      const n = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value;

      if (!g || !n || !email || !password) {
        showToast('⚠️ Datos incompletos', true);
        return;
      }
      if (password.length < 8) {
        showToast('⚠️ La contraseña debe tener al menos 8 caracteres', true);
        return;
      }
      const res = await apiCall({ action: 'register', playerName: n, email, password, groupName: g, isNewGroup: true }, { method: 'POST' });
      if (res?.status === 'success') {
        const userName = res.data?.name || n;
        localStorage.setItem('worldcup2026_user', JSON.stringify({ email, name: userName, userId: res.data.userId, groupName: g, isAdmin: true }));
        localStorage.setItem('worldcup2026_setupMode', 'true');
        showToast('✨ Registro completado');
        setTimeout(() => window.location.href = 'scoring_criteria.html', 1500);
      } else {
        showToast('❌ ' + (res?.message || 'Error'), true);
      }
    };

    // Update active language button styling
    function updateLangButtons() {
      const currentLocale = window.i18n?.locale || 'es';
      document.querySelectorAll('.lang-btn').forEach(btn => {
        if (btn.getAttribute('data-lang') === currentLocale) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    document.addEventListener('DOMContentLoaded', updateLangButtons);
    document.addEventListener('languageChanged', updateLangButtons);
    // Call immediately in case DOMContentLoaded has already fired
    updateLangButtons();
  </script>
</body>
</html>
