<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Porra Mundial 2026</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-msg { color: var(--accent-red); font-size: 0.75rem; font-weight: 600; margin-top: 6px; display: flex; align-items: center; gap: 6px; animation: fadeIn 0.3s ease; }
    .error-msg::before { content: '⚠️'; }
    .input-error { border-color: var(--accent-red) !important; background-color: rgba(239, 68, 68, 0.05) !important; animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both; }
    @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .group-info-msg { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
  </style>
</head>

<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">⚽</div>
      <h1 class="login-title">Porra Mundial 2026</h1>
      <p class="login-subtitle" id="formSubtitle">Inicia sesión para ver tu clasificación</p>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
      <div class="form-group">
        <label class="form-label" for="loginPlayerName">Tu Nombre</label>
        <input type="text" id="loginPlayerName" class="login-input" placeholder="Ej: Pepito Pérez" autocomplete="off">
        <p id="playerStatus" class="group-info-msg"></p>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginGroupSelect">Selecciona tu grupo</label>
        <select id="loginGroupSelect" class="login-input">
          <option value="">Primero introduce tu nombre...</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPin">Tu PIN de 4 dígitos</label>
        <div class="pin-container">
          <input type="password" id="loginPin" class="login-input" maxlength="4" placeholder="••••" inputmode="numeric">
          <button type="button" class="pin-toggle" id="togglePinLogin">👁️</button>
        </div>
        <p id="loginPinError" class="error-msg" style="display:none;"></p>
      </div>
      <button class="login-btn btn-primary" id="btnLogin"><span>Entrar</span><span class="icon">➜</span></button>
      <div class="login-switch">¿Quieres crear un grupo? <span id="switchToRegister">Hazlo aquí</span></div>
    </div>

    <!-- Register Form -->
    <div id="registerForm" style="display: none;">
      <div class="form-group">
        <label class="form-label" for="regGroup">Nombre del Grupo</label>
        <input type="text" id="regGroup" class="login-input" placeholder="Ej: Los Sharks">
      </div>
      <div class="form-group">
        <label class="form-label" for="regName">Nombre del jugador</label>
        <input type="text" id="regName" class="login-input" placeholder="Ej: Pepito Pérez">
      </div>
      <div class="form-group">
        <label class="form-label" for="regPin">Crea tu PIN de 4 dígitos</label>
        <div class="pin-container">
          <input type="password" id="regPin" class="login-input" maxlength="4" placeholder="••••" inputmode="numeric">
          <button type="button" class="pin-toggle" id="togglePinReg">👁️</button>
        </div>
        <p id="regPinError" class="error-msg" style="display:none;"></p>
      </div>
      <button class="login-btn btn-primary" id="btnRegister"><span>Crear cuenta</span><span class="icon">✨</span></button>
      <div class="login-switch">¿Ya tienes cuenta? <span id="switchToLogin">Inicia sesión</span></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="web_config.js"></script>
  <script type="module">
    import { showToast } from './shared_ui.js';
    import { apiCall } from './agente_mundial/dataFetcher.js';

    const loginName = document.getElementById('loginPlayerName');
    const loginGroup = document.getElementById('loginGroupSelect');
    const loginPin = document.getElementById('loginPin');
    const playerStatus = document.getElementById('playerStatus');

    let debounceTimer;
    loginName.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        const name = loginName.value.trim();
        if (name.length < 2) {
          loginGroup.innerHTML = '<option value="">Primero introduce tu nombre...</option>';
          playerStatus.textContent = '';
          return;
        }
        playerStatus.textContent = '🔍 Buscando tus grupos...';
        const res = await apiCall({ action: 'getGroupsForPlayer', playerName: name });
        if (res?.status === 'success') {
          if (res.data.length === 0) {
            loginGroup.innerHTML = '<option value="">Usuario no encontrado</option>';
            playerStatus.textContent = '⚠️ No encuentro ningún grupo con ese nombre.';
          } else {
            loginGroup.innerHTML = res.data.length > 1 ? '<option value="">-- Selecciona tu grupo --</option>' : '';
            res.data.forEach(g => loginGroup.add(new Option(g, g)));
            playerStatus.textContent = `✅ ¡Te he encontrado en ${res.data.length} grupo(s)!`;
          }
        } else {
          playerStatus.textContent = '❌ Error de conexión';
        }
      }, 500);
    });

    document.getElementById('btnLogin').onclick = async () => {
      const name = loginName.value.trim();
      const group = loginGroup.value;
      const pin = loginPin.value;
      if (!name || !group || pin.length !== 4) {
        showToast('⚠️ Completa todos los campos', true);
        return;
      }
      const res = await apiCall({ action: 'login', playerName: name, playerPin: pin, groupName: group }, { method: 'POST' });
      if (res?.status === 'success') {
        localStorage.setItem('worldcup2026_user', JSON.stringify({ 
            name, 
            pin, 
            groupName: group, 
            isAdmin: res.data.isAdmin // <-- Corregido aquí
        }));
        showToast('✅ Login correcto');
        setTimeout(() => window.location.href = 'worldcup.html', 1000);
      } else {
        showToast('❌ ' + (res?.message || 'Error'), true);
      }
    };

    // Toggle Pin Visibility
    const toggle = (id) => {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    };
    document.getElementById('togglePinLogin').onclick = () => toggle('loginPin');
    document.getElementById('togglePinReg').onclick = () => toggle('regPin');

    // Switch Forms
    const switchF = (type) => {
      document.getElementById('loginForm').style.display = type === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = type === 'register' ? 'block' : 'none';
      document.getElementById('formSubtitle').textContent = type === 'login' ? 'Inicia sesión' : 'Regístrate';
    };
    document.getElementById('switchToRegister').onclick = () => switchF('register');
    document.getElementById('switchToLogin').onclick = () => switchF('login');

    document.getElementById('btnRegister').onclick = async () => {
      const g = document.getElementById('regGroup').value.trim();
      const n = document.getElementById('regName').value.trim();
      const p = document.getElementById('regPin').value;
      if (!g || !n || p.length !== 4) { showToast('⚠️ Datos incompletos', true); return; }
      const res = await apiCall({ action: 'register', playerName: n, playerPin: p, groupName: g, isNewGroup: true }, { method: 'POST' });
      if (res?.status === 'success') {
        localStorage.setItem('worldcup2026_user', JSON.stringify({ name: n, pin: p, groupName: g, isAdmin: true }));
        showToast('✨ Registro completado');
        setTimeout(() => window.location.href = 'worldcup.html', 1500);
      } else {
        showToast('❌ ' + (res?.message || 'Error'), true);
      }
    };
  </script>
</body>
</html>
